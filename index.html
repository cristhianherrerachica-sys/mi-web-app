<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Dash | Base de Datos</title>
    <meta name="description" content="Visualiza todos los datos de equipos y jugadores de la liga.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Football Central</h1>
            <p>Panel de Gestión y Visualización de la Base de Datos</p>
        </header>

        <section id="teams-section">
            <h2 class="section-title">Equipos de la Liga</h2>
            <div id="teams-grid" class="teams-grid">
                <!-- Se inyectarán mediante JavaScript -->
                <div class="card animate-fade">
                    <p>Cargando equipos...</p>
                </div>
            </div>
        </section>

        <section id="registration-section" class="registration-section">
            <h2 class="section-title">Inscripción de Jugadores</h2>
            <div class="registration-container animate-fade">
                <form id="player-form" class="registration-form">
                    <div class="form-group">
                        <label for="reg-name">Nombre</label>
                        <input type="text" id="reg-name" placeholder="Ej: Kylian" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-surname">Apellidos</label>
                        <input type="text" id="reg-surname" placeholder="Ej: Mbappé" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-pos">Posición</label>
                        <select id="reg-pos" required>
                            <option value="" disabled selected>Seleccionar...</option>
                            <option value="Portero">Portero</option>
                            <option value="Defensa">Defensa</option>
                            <option value="Centrocampista">Centrocampista</option>
                            <option value="Delantero">Delantero</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="reg-dorsal">Dorsal</label>
                        <input type="number" id="reg-dorsal" placeholder="1-99" min="1" max="99" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-team">Equipo</label>
                        <select id="reg-team" required>
                            <option value="" disabled selected>Cargando equipos...</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-submit">Inscribir Jugador</button>
                    </div>
                </form>
            </div>
        </section>

        <section id="players-section">
            <div class="controls">
                <h2 class="section-title">Plantilla General</h2>
                <div class="search-wrapper">
                    <input type="text" id="playerSearch" placeholder="Buscar jugador, posición o equipo...">
                </div>
            </div>
            
            <div class="players-container animate-fade">
                <table id="players-table">
                    <thead>
                        <tr>
                            <th>Dorsal</th>
                            <th>Nombre</th>
                            <th>Apellidos</th>
                            <th>Posición</th>
                            <th>Equipo</th>
                        </tr>
                    </thead>
                    <tbody id="players-body">
                        <!-- Se inyectarán mediante JavaScript -->
                        <tr>
                            <td colspan="5" style="text-align: center;">Cargando jugadores...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
